name: Docker Image CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
#use mac runner
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

#make .env
      - name: Make .env
        run: |
            touch ./.env
            echo "${{ secrets.ENV }}" >> ./.env
        shell: bash

#set buiidx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

#login docker
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD}}

#docker build
      - name: Docker Build
        run: docker buildx build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/nonghaeng-fe:latest --push .

#docker push
      - name: Docker Push
        run: docker push ${{ secrets.DOCKER_USERNAME }}/nonghaeng-fe

#docker pull and run
      - name: Pull and Run
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port : ${{ secrets.SSH_PORT }}
          script: |
            cd ~/docker-compose/nonghaeng/fe
            docker-compose down
            docker rmi $(docker images | grep "${{ secrets.DOCKER_USERNAME }}/nonghaeng-fe" | awk '{print $3}')
            docker-compose up -d
            exit
