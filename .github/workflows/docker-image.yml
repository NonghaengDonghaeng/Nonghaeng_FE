name: Docker Image CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Make .env
        run: |
          touch ./.env
          echo "${{ secrets.ENV }}" >> ./.env
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD}}

      - name: Build and Push
        uses: docker/build-push-action@v2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nonghaeng-fe:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          script: |
            docker rmi $(docker images | grep "${{ secrets.DOCKER_USERNAME }}/nonghaeng-fe" | awk '{print $3}')

      - name: Pull and Run
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port : ${{ secrets.SSH_PORT }}
          script: |
            cd ~/docker-compose/nonghaeng/fe
            docker-compose down
            docker rmi $(docker images | grep "${{ secrets.DOCKER_USERNAME }}/nonghaeng-fe" | awk '{print $3}')
            docker-compose up -d
            exit
